name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify commit attribution
        run: scripts/check-git-attribution.sh
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
  homeassistant:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: baseline
            python-version: '3.13'
            requirements: requirements-test.txt
          - lane: current
            python-version: '3.14'
            requirements: requirements-test-current.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install Home Assistant test lane
        run: pip install -r ${{ matrix.requirements }}
      - run: python -m pytest -q
      - name: Validate HACS distribution
        run: |
          bash -n scripts/*.sh
          scripts/export-hacs.sh "$RUNNER_TEMP/ha-fruit-forwarder"
          scripts/check-hacs-export.sh
  go:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Task
        run: brew install go-task
      - run: task metadata:check
      - run: task test:go
      - run: bash -n scripts/install-macos.sh
      - run: task test:native
      - run: task build:macos
