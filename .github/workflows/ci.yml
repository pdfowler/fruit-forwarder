name: CI

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
  homeassistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q
      - name: Validate HACS distribution
        run: |
          bash -n scripts/*.sh
          scripts/export-hacs.sh "$RUNNER_TEMP/ha-fruit-forwarder"
          scripts/check-hacs-export.sh
  go:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: bash -n scripts/install-macos.sh
      - name: Build native EventKit helper
        run: |
          mkdir -p build
          swiftc -O -parse-as-library eventkit-helper/main.swift \
            -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist \
            -Xlinker "$PWD/deployment/eventkit-helper-Info.plist" \
            -o build/icloud-reminders-eventkit
          codesign --force --sign - --options runtime \
            --identifier com.example.icloud-reminders-bridge.eventkit \
            --entitlements deployment/reminders.entitlements \
            build/icloud-reminders-eventkit
          codesign --verify --strict build/icloud-reminders-eventkit
      - run: python3 scripts/test-native-calendar.py
