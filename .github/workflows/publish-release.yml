name: Publish confirmed release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH to create a GitHub release from fresh artifacts
        required: true
        type: string
      notarization_review:
        description: Type APPROVED after the separate Developer ID/notarization review
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare-ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: scripts/package-ha.sh "$(tr -d '[:space:]' < release/VERSION)"
      - uses: actions/upload-artifact@v4
        with:
          name: release-ha
          path: dist/ha

  verify-current-ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-test-current.txt
      - name: Install current Home Assistant compatibility lane
        run: pip install -r requirements-test-current.txt
      - name: Run current Home Assistant runtime suite
        run: python -m pytest -q

  prepare-macos:
    runs-on: macos-latest
    env:
      # Release review must provide a Developer ID identity and the protected
      # certificate secrets below. Local preparation intentionally falls back
      # to ad-hoc signing, but the guarded publication path rejects it.
      FRUIT_FORWARDER_SIGN_IDENTITY: ${{ vars.FRUIT_FORWARDER_SIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Require a maintainer-selected Developer ID identity
        run: |
          test -n "${FRUIT_FORWARDER_SIGN_IDENTITY}"
          test "${FRUIT_FORWARDER_SIGN_IDENTITY}" != "-"
      - name: Import the Developer ID certificate into an ephemeral keychain
        env:
          CERTIFICATE_BASE64: ${{ secrets.FRUIT_FORWARDER_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.FRUIT_FORWARDER_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.FRUIT_FORWARDER_SIGNING_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${CERTIFICATE_BASE64}"
          test -n "${CERTIFICATE_PASSWORD}"
          test -n "${KEYCHAIN_PASSWORD}"
          keychain="${RUNNER_TEMP}/fruit-forwarder-signing.keychain-db"
          certificate="${RUNNER_TEMP}/fruit-forwarder-signing.p12"
          printf '%s' "${CERTIFICATE_BASE64}" | base64 -D > "${certificate}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain}"
          security import "${certificate}" -k "${keychain}" \
            -P "${CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "${keychain}"
          security default-keychain -s "${keychain}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${keychain}"
          security find-identity -v -p codesigning "${keychain}" | \
            grep -F "\"${FRUIT_FORWARDER_SIGN_IDENTITY}\""
          {
            echo "FRUIT_FORWARDER_KEYCHAIN_PATH=${keychain}"
            echo "FRUIT_FORWARDER_CERTIFICATE_PATH=${certificate}"
          } >> "${GITHUB_ENV}"
      - run: scripts/package-macos.sh "$(tr -d '[:space:]' < release/VERSION)"
      - run: scripts/package-mcpb.sh "$(tr -d '[:space:]' < release/VERSION)"
      - name: Render and verify MCP Registry metadata
        run: |
          version="$(tr -d '[:space:]' < release/VERSION)"
          checksum="$(awk '{print $1}' "dist/mcp/fruit-forwarder-mcp-${version}.mcpb.sha256")"
          scripts/render-mcp-server-json.sh "$version" \
            "https://github.com/pdfowler/fruit-forwarder/releases/download/v${version}/fruit-forwarder-mcp-${version}.mcpb" \
            "$checksum"
          scripts/check-mcp-package.sh "$version"
      - run: python3 scripts/render-release-manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/macos
            dist/mcp
            dist/release-manifest.json
      - name: Remove the ephemeral signing keychain
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ -n "${FRUIT_FORWARDER_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "${FRUIT_FORWARDER_KEYCHAIN_PATH}" >/dev/null 2>&1 || true
          fi
          if [[ -n "${FRUIT_FORWARDER_CERTIFICATE_PATH:-}" ]]; then
            rm -f "${FRUIT_FORWARDER_CERTIFICATE_PATH}"
          fi

  publish:
    if: ${{ inputs.confirm == 'PUBLISH' && inputs.notarization_review == 'APPROVED' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [prepare-ha, verify-current-ha, prepare-macos]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify tagged source and attribution
        run: |
          version="$(tr -d '[:space:]' < release/VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test -z "$(git status --porcelain)"
          scripts/check-git-attribution.sh
      - name: Rebuild and verify the unified release manifest
        run: |
          python3 scripts/render-release-manifest.py --base-manifest dist/release-manifest.json
          scripts/check-release-manifest.py
      - name: Create GitHub release with immutable candidate assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("dist/release-manifest.json"))["version"])')"
          notes_file="release/notes/${version}.md"
          test -f "${notes_file}"
          mapfile -t assets < <(find dist -type f ! -name 'release-manifest.json' -print | sort)
          gh release create "v${version}" "${assets[@]}" \
            --verify-tag \
            --title "Fruit Forwarder ${version}" \
            --notes-file "${notes_file}"
