name: Release preparation

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  metadata-and-ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate metadata and deterministic HACS export
        run: |
          version="$(tr -d '[:space:]' < release/VERSION)"
          test -f "release/notes/${version}.md"
          python3 -m json.tool release/compatibility.json >/dev/null
          python3 -m json.tool packaging/mcp/server.json.in >/dev/null
          scripts/export-hacs.sh "$RUNNER_TEMP/ha-fruit-forwarder"
          scripts/check-hacs-export.sh
          scripts/package-ha.sh "$(tr -d '[:space:]' < release/VERSION)"
      - uses: actions/upload-artifact@v4
        with:
          name: ha-fruit-forwarder
          path: |
            ${{ runner.temp }}/ha-fruit-forwarder
            dist/ha

  homeassistant-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: baseline
            python-version: '3.13'
            requirements: requirements-test.txt
          - lane: current
            python-version: '3.14'
            requirements: requirements-test-current.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install Home Assistant compatibility lane
        run: pip install -r ${{ matrix.requirements }}
      - name: Run Home Assistant runtime suite
        run: python -m pytest -q

  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build versioned bridge
        run: scripts/package-macos.sh "$(tr -d '[:space:]' < release/VERSION)"
      - name: Build MCPB bundle
        run: scripts/package-mcpb.sh "$(tr -d '[:space:]' < release/VERSION)"
      - name: Render MCP Registry metadata for the planned release URL
        run: |
          version="$(tr -d '[:space:]' < release/VERSION)"
          checksum="$(awk '{print $1}' "dist/mcp/fruit-forwarder-mcp-${version}.mcpb.sha256")"
          scripts/render-mcp-server-json.sh "$version" \
            "https://github.com/pdfowler/fruit-forwarder/releases/download/v${version}/fruit-forwarder-mcp-${version}.mcpb" \
            "$checksum"
          scripts/check-mcp-package.sh "$version"
      - name: Record release provenance and hashes
        run: python3 scripts/render-release-manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: fruit-forwarder-macos-unsigned
          path: |
            dist/macos
            dist/mcp
            dist/release-manifest.json
