version: '3'

vars:
  VERSION:
    sh: "tr -d '[:space:]' < release/VERSION"

tasks:
  default:
    deps: [check]

  check:
    deps: [format:check, test:go, test:ha, metadata:check, provenance:check, security:scan]

  provenance:check:
    cmds:
      - scripts/check-git-attribution.sh

  security:scan:
    cmds:
      - |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks detect --no-banner --redact --log-opts='--all'
        else
          echo "gitleaks not installed; CI performs the authoritative history scan"
        fi

  format:check:
    cmds:
      - test -z "$(gofmt -l $(find cmd internal -name '*.go' -type f))"
      - python3 -m json.tool config.example.json >/dev/null
      - python3 -m json.tool homeassistant/custom_components/icloud_reminders_bridge/manifest.json >/dev/null
      - python3 -m json.tool release/compatibility.json >/dev/null
      - bash -n scripts/install-macos.sh scripts/install-package-macos.sh scripts/install-artifact-macos.sh scripts/uninstall-macos.sh scripts/rollback-macos.sh scripts/export-hacs.sh scripts/check-hacs-target.sh scripts/render-mcp-server-json.sh scripts/check-identifiers.sh scripts/check-git-attribution.sh
      - bash -n scripts/build-macos.sh scripts/package-ha.sh scripts/package-macos.sh scripts/package-mcpb.sh scripts/check-hacs-export.sh scripts/check-ha-package.sh scripts/check-macos-package.sh scripts/check-mcp-package.sh

  test:go:
    cmds:
      - go test -race ./...
      - go vet ./...

  test:ha:
    cmds:
      - test -x .venv/bin/python
      - .venv/bin/python -m pytest -q

  test:
    deps: [test:go, test:ha]
    cmds:
      - |
        if [[ "$(uname -s)" == "Darwin" ]]; then
          task test:native
        else
          echo "native EventKit tests skipped on $(uname -s); run task test on macOS for the complete local suite"
        fi

  test:native:
    platforms: [darwin]
    cmds:
      - mkdir -p dist/native
      - swiftc -O -parse-as-library eventkit-helper/main.swift -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist -Xlinker "$(pwd)/deployment/eventkit-helper-Info.plist" -o dist/native/icloud-reminders-eventkit
      - codesign --force --sign - --options runtime --identifier com.pdfowler.fruitforwarder.eventkit --entitlements deployment/reminders.entitlements dist/native/icloud-reminders-eventkit
      - codesign --verify --strict dist/native/icloud-reminders-eventkit
      - FRUIT_FORWARDER_EVENTKIT_BINARY="$(pwd)/dist/native/icloud-reminders-eventkit" python3 scripts/test-native-calendar.py

  metadata:check:
    cmds:
      - test "$(cat release/VERSION)" = "$(python3 -c 'import json; print(json.load(open("release/compatibility.json"))["mac_application_version"])')"
      - test "$(cat release/VERSION)" = "$(python3 -c 'import json; print(json.load(open("release/compatibility.json"))["mcp_server_version"])')"
      - test "$(cat release/VERSION)" = "$(python3 -c 'import json; print(json.load(open("release/compatibility.json"))["home_assistant_integration_version"])')"
      - test "$(cat release/VERSION)" = "$(python3 -c 'import json; print(json.load(open("homeassistant/custom_components/icloud_reminders_bridge/manifest.json"))["version"])')"
      - test "$(cat release/VERSION)" = "$(python3 -c 'import plistlib; print(plistlib.load(open("deployment/Info.plist", "rb"))["CFBundleShortVersionString"])')"
      - test "$(cat release/VERSION)" = "$(python3 -c 'import plistlib; print(plistlib.load(open("deployment/eventkit-helper-Info.plist", "rb"))["CFBundleShortVersionString"])')"
      - python3 -m json.tool hacs.json >/dev/null
      - python3 -m json.tool packaging/mcp/server.json.in >/dev/null
      - python3 -m json.tool packaging/mcp/manifest.json.in >/dev/null
      - python3 -m json.tool packaging/mcp/config.example.json >/dev/null
      - python3 -c 'import ast; ast.parse(open("scripts/render-release-manifest.py").read())'
      - python3 -c 'import ast; ast.parse(open("scripts/render-launchagent.py").read())'
      - python3 -c 'import ast; ast.parse(open("scripts/package-hacs.py").read())'
      - python3 -c 'import ast; ast.parse(open("scripts/package-tar.py").read())'
      - python3 -c 'import ast; ast.parse(open("scripts/normalize-zip.py").read())'
      - python3 -c 'import ast; ast.parse(open("scripts/check-release-manifest.py").read())'
      - scripts/check-identifiers.sh

  package:ha:
    deps: [metadata:check]
    cmds:
      - scripts/package-ha.sh {{.VERSION}}

  build:macos:
    platforms: [darwin]
    cmds:
      - scripts/build-macos.sh {{.VERSION}}

  package:macos:
    platforms: [darwin]
    cmds:
      - scripts/package-macos.sh {{.VERSION}}

  package:mcp:
    platforms: [darwin]
    cmds:
      - scripts/package-mcpb.sh {{.VERSION}}
      - |
        checksum="$(awk '{print $1}' "dist/mcp/fruit-forwarder-mcp-{{.VERSION}}.mcpb.sha256")"
        scripts/render-mcp-server-json.sh "{{.VERSION}}" \
          "https://github.com/pdfowler/fruit-forwarder/releases/download/v{{.VERSION}}/fruit-forwarder-mcp-{{.VERSION}}.mcpb" \
          "${checksum}"
      - scripts/check-mcp-package.sh {{.VERSION}}

  install:local:
    platforms: [darwin]
    requires:
      vars: [PACKAGE]
    cmds:
      - >-
        scripts/install-artifact-macos.sh "{{.PACKAGE}}"
        {{if .INSTALL_ONLY}}--install-only{{end}}
        {{if .MIGRATE_HOME_CTRL}}--migrate-home-ctrl{{end}}

  release:check:
    deps: [check, package:ha]
    cmds:
      - |
        if [[ "$(uname -s)" == "Darwin" ]]; then
          task package:macos
          task package:mcp
        else
          echo "macOS artifacts skipped on $(uname -s); run release:check on macOS for the complete candidate"
        fi
      - test -f dist/ha-fruit-forwarder/custom_components/icloud_reminders_bridge/manifest.json
      - test -f dist/ha-fruit-forwarder/brand/icon.png
      - scripts/check-hacs-export.sh

  release:prepare:
    deps: [release:check]
    cmds:
      - |
        mkdir -p dist
        python3 scripts/render-release-manifest.py
      - scripts/check-release-manifest.py

  publish:release:
    desc: Dispatch the protected GitHub release workflow for an exact tag
    requires:
      vars: [TAG, CONFIRM]
    env:
      FRUIT_FORWARDER_RELEASE_TAG: "{{.TAG}}"
      FRUIT_FORWARDER_RELEASE_CONFIRM: "{{.CONFIRM}}"
    cmds:
      - scripts/check-publish-ref.sh
      - |
        test "${FRUIT_FORWARDER_RELEASE_CONFIRM}" = "PUBLISH"
        gh workflow run publish-release.yml \
          --ref "${FRUIT_FORWARDER_RELEASE_TAG}" \
          --field confirm=PUBLISH

  publish:hacs:
    desc: Dispatch the protected HACS distribution workflow for an exact tag
    requires:
      vars: [TAG, CONFIRM, HACS_REPOSITORY]
    env:
      FRUIT_FORWARDER_RELEASE_TAG: "{{.TAG}}"
      FRUIT_FORWARDER_RELEASE_CONFIRM: "{{.CONFIRM}}"
      FRUIT_FORWARDER_HACS_REPOSITORY: "{{.HACS_REPOSITORY}}"
    cmds:
      - scripts/check-publish-ref.sh
      - |
        test "${FRUIT_FORWARDER_RELEASE_CONFIRM}" = "PUBLISH_HACS"
        [[ "${FRUIT_FORWARDER_HACS_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/ha-fruit-forwarder$ ]]
        gh workflow run publish-hacs.yml \
          --ref "${FRUIT_FORWARDER_RELEASE_TAG}" \
          --field confirm=PUBLISH_HACS \
          --field hacs_repository="${FRUIT_FORWARDER_HACS_REPOSITORY}"

  publish:mcp:
    desc: Dispatch the protected MCP Registry workflow for an exact tag
    requires:
      vars: [TAG, CONFIRM, PUBLISHER_URL, PUBLISHER_SHA256]
    env:
      FRUIT_FORWARDER_RELEASE_TAG: "{{.TAG}}"
      FRUIT_FORWARDER_RELEASE_CONFIRM: "{{.CONFIRM}}"
      FRUIT_FORWARDER_MCP_PUBLISHER_URL: "{{.PUBLISHER_URL}}"
      FRUIT_FORWARDER_MCP_PUBLISHER_SHA256: "{{.PUBLISHER_SHA256}}"
    cmds:
      - scripts/check-publish-ref.sh
      - |
        test "${FRUIT_FORWARDER_RELEASE_CONFIRM}" = "PUBLISH_MCP"
        [[ "${FRUIT_FORWARDER_MCP_PUBLISHER_URL}" == https://github.com/modelcontextprotocol/registry/releases/download/*/mcp-publisher_linux_amd64.tar.gz ]]
        [[ "${FRUIT_FORWARDER_MCP_PUBLISHER_SHA256}" =~ ^[a-f0-9]{64}$ ]]
        gh workflow run publish-mcp.yml \
          --ref "${FRUIT_FORWARDER_RELEASE_TAG}" \
          --field confirm=PUBLISH_MCP \
          --field publisher_url="${FRUIT_FORWARDER_MCP_PUBLISHER_URL}" \
          --field publisher_sha256="${FRUIT_FORWARDER_MCP_PUBLISHER_SHA256}"
